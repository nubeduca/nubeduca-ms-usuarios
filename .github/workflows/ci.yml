name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt ruff yamllint
      - name: Lint de Python
        run: ruff check --isolated --select E4,E7,E9,F .
      - name: Lint de YAML
        run: yamllint -c .yamllint.yml serverless.yml .github
      - name: Pruebas (moto, sin AWS)
        run: python -m pytest -q
